name: Build & Package

# 云端打包流水线（本地不打包）：
# - debug：每次 push/PR 自动构建，产物上传为 artifact
# - release：main 分支 push 时构建；签名密钥来自 GitHub Secrets（KEYSTORE_BASE64 等）

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowlume-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-release:
    name: Release APK (signed)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: build-debug
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore from Secrets
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/flowlume-release.jks"
          echo "keystore decoded: $(wc -c < "$RUNNER_TEMP/flowlume-release.jks") bytes"

      - name: Assemble release (signed)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PKEYSTORE_FILE="$RUNNER_TEMP/flowlume-release.jks" \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEYSTORE_KEY_PASSWORD="$KEYSTORE_KEY_PASSWORD"

      - name: Assemble release (unsigned fallback)
        if: env.KEYSTORE_BASE64 == ''
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowlume-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
