name: Build & Release

# 云端打包（本地不打包）：
# - push 到 main / 手动触发时构建签名 Release APK
# - 自动发布到 GitHub Releases（tag 格式 v<versionName>）
# - 签名凭据来自 GitHub Secrets：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEYSTORE_KEY_PASSWORD
# - 未配置 Secrets 时产出未签名 APK（fallback）

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Release APK (signed)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore from Secrets
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/flowlume-release.jks"
          echo "keystore decoded: $(wc -c < "$RUNNER_TEMP/flowlume-release.jks") bytes"

      - name: Assemble release (signed)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PKEYSTORE_FILE="$RUNNER_TEMP/flowlume-release.jks" \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEYSTORE_KEY_PASSWORD="$KEYSTORE_KEY_PASSWORD"

      - name: Assemble release (unsigned fallback)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Resolve version
        id: ver
        run: |
          V=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "resolved version: $V"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: FlowLume v${{ steps.ver.outputs.version }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
